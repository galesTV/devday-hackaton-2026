[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-alimentos"
version = "0.1.0"
description = "Conferência explicável de compras públicas de alimentos"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "streamlit>=1.40", "openai>=1.66.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
